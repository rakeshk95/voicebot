<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function addMessage(message) {
            const p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ': ' + message;
            messagesDiv.appendChild(p);
        }
        
        const wsUrl = 'ws://localhost:8000/ws/batch-calls';
        addMessage('Attempting to connect to: ' + wsUrl);
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = function() {
            statusDiv.textContent = 'Connected!';
            statusDiv.style.color = 'green';
            addMessage('✅ WebSocket connected successfully');
            
            // Send a ping message
            ws.send(JSON.stringify({type: 'ping'}));
            addMessage('📤 Sent ping message');
        };
        
        ws.onmessage = function(event) {
            addMessage('📨 Received: ' + event.data);
        };
        
        ws.onerror = function(error) {
            statusDiv.textContent = 'Error!';
            statusDiv.style.color = 'red';
            addMessage('❌ WebSocket error: ' + error);
        };
        
        ws.onclose = function(event) {
            statusDiv.textContent = 'Disconnected';
            statusDiv.style.color = 'red';
            addMessage('🔌 WebSocket closed: ' + event.code + ' - ' + event.reason);
        };
    </script>
</body>
</html>
